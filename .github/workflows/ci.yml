name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      BARTIDY_SIGN_IDENTITY: "-"
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check scripts and source
        run: |
          zsh -n Tools/build.sh Tools/integration-test.sh
          python3 Tools/audit-input-control.py
      - name: Run core tests
        run: swift test
      - name: Build and audit app
        run: Tools/build.sh
      - name: Verify bundled notices
        run: |
          cmp LICENSE build/Bilby.app/Contents/Resources/LICENSE
          cmp THIRD_PARTY_NOTICES.md build/Bilby.app/Contents/Resources/THIRD_PARTY_NOTICES.md
          cmp Resources/GitHubLink.pdf build/Bilby.app/Contents/Resources/GitHubLink.pdf
          cmp Resources/ThirdParty/RemixIcon.LICENSE build/Bilby.app/Contents/Resources/ThirdParty/RemixIcon.LICENSE
